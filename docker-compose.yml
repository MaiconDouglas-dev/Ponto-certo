# Parada Certa - API Dispositivos: ambiente completo em containers.
#
#   docker compose up -d --build                      -> tudo: Oracle, RabbitMQ, MongoDB e a API (porta 5117)
#   docker compose up -d oracle rabbitmq mongodb      -> só as dependências (a API roda pelo VSCode, porta 5117)
#
# Só precisa do Docker. Funciona sem o arquivo .env: os valores abaixo depois de ":-" são os padrões
# de DESENVOLVIMENTO LOCAL. Para trocá-los (ou trocar uma porta ocupada), copie .env.example para .env.
name: parada-certa

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle_dev}
      APP_USER: ${ORACLE_APP_USER:-parada}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-parada_dev}
    ports:
      - "${ORACLE_PORTA:-1521}:1521"
    volumes:
      - oracle-dados:/opt/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d:ro
      - ./db/scripts:/opt/parada-certa/scripts:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-parada}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-parada_dev}
    ports:
      - "${RABBITMQ_PORTA:-5672}:5672"             # AMQP
      - "${RABBITMQ_PAINEL_PORTA:-15672}:15672"    # painel: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-parada}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-parada_dev}
    ports:
      - "${MONGO_PORTA:-27018}:27017"   # 27018 no host para não conflitar com um MongoDB local
    volumes:
      - mongo-dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      # 5117 no host (a mesma porta de quando roda pelo VSCode); 8080 costuma estar ocupada pela API Java.
      - "${API_PORTA:-5117}:8080"     # Swagger: http://localhost:5117/swagger
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Oracle: "User Id=${ORACLE_APP_USER:-parada};Password=${ORACLE_APP_PASSWORD:-parada_dev};Data Source=oracle:1521/FREEPDB1"
      ConnectionStrings__MongoDb: "mongodb://${MONGO_USER:-parada}:${MONGO_PASSWORD:-parada_dev}@mongodb:27017/?authSource=admin"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Usuario: ${RABBITMQ_USER:-parada}
      RabbitMq__Senha: ${RABBITMQ_PASSWORD:-parada_dev}
      Jwt__Chave: ${JWT_CHAVE:-dev-somente-local-troque-em-producao-0123456789}
      Cartao__ChaveHmac: ${CARTAO_CHAVE_HMAC:-dev-somente-local-hmac-cartao-0123456789abcdef}
    restart: unless-stopped
    depends_on:
      oracle: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }

volumes:
  oracle-dados:
  mongo-dados:
